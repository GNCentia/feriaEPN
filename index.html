function pad(cv,V,f,lab){const x=cv.getContext('2d'),P={s:[],er:0,sol:0,on:0};let W,H;
const X=v=>(v-V[0])/(V[1]-V[0])*W,Y=v=>H-(v-V[2])/(V[3]-V[2])*H;
P.draw=()=>{const r=devicePixelRatio||1;x.setTransform(r,0,0,r,0,0);x.fillStyle='#fff';x.fillRect(0,0,W,H);
if(V){x.strokeStyle='#e2e2e2';x.lineWidth=1;x.fillStyle='#555';x.font='12px sans-serif';const sx=Math.max(1,Math.ceil((V[1]-V[0])/16)),sy=Math.max(1,Math.ceil((V[3]-V[2])/10));
for(let a=Math.ceil(V[0]);a<=V[1];a+=sx){x.beginPath();x.moveTo(X(a),0);x.lineTo(X(a),H);x.stroke();a&&x.fillText(a,X(a)+2,Y(0)+13)}
for(let b=Math.ceil(V[2]);b<=V[3];b+=sy){x.beginPath();x.moveTo(0,Y(b));x.lineTo(W,Y(b));x.stroke();b&&x.fillText(b,X(0)+4,Y(b)-2)}
x.strokeStyle='#132A47';x.lineWidth=2;x.beginPath();x.moveTo(X(0),0);x.lineTo(X(0),H);x.moveTo(0,Y(0));x.lineTo(W,Y(0));x.stroke();x.fillStyle='#132A47';x.font='bold 14px sans-serif';x.fillText(lab?lab[0]:'x',W-70,Y(0)-8);x.fillText(lab?lab[1]:'y',X(0)+8,16);
if(P.sol){x.strokeStyle='#D72638';x.lineWidth=3;x.beginPath();let pv=null;for(let k=0;k<=1200;k++){const a=V[0]+(V[1]-V[0])*k/1200,b=f(a);if(!isFinite(b)||Math.abs(b)>1e4){pv=null;continue}if(pv===null||Math.abs(b-pv)>V[3]-V[2])x.moveTo(X(a),Y(b));else x.lineTo(X(a),Y(b));pv=b}x.stroke()}}
x.strokeStyle='#1EAE8D';x.lineWidth=4;x.lineCap=x.lineJoin='round';P.s.forEach(s=>{x.beginPath();s.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke()})};
const fit=()=>{const b=cv.getBoundingClientRect(),r=devicePixelRatio||1;W=b.width;H=b.height;cv.width=W*r;cv.height=H*r;P.draw()};
const pt=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
const kill=p=>P.s=P.s.filter(s=>!s.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<18));
cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);P.on=1;const p=pt(e);if(P.er)kill(p);else{P.cur=[p,p];P.s.push(P.cur)}P.draw()};
cv.onpointermove=e=>{if(!P.on)return;const p=pt(e);P.er?kill(p):P.cur.push(p);P.draw()};
cv.onpointerup=cv.onpointercancel=()=>P.on=0;
P.u=()=>{P.s.pop();P.draw()};P.c=()=>{P.s=[];P.draw()};onresize=fit;fit();return P}

go(`<h2 class="c">FINAL · ${s.d} NOV</h2><div class="card"><ol>${N.map(q=>`<li>${esc(q[0])} <b>${s.show?'→ '+esc(q[1]):''}</b>`).join('')}</ol><button class="b s" onclick="FS.show=1;fgrid()">Mostrar respuestas (cuando todos terminen)</button></div><div class="card"><table><tr><th>Finalista${N.map((q,i)=>'<th>P'+(i+1)).join('')}<th>Total</tr>${s.fs.map(f=>`<tr><td>${esc(f.al)}${N.map((q,i)=>`<td><input type="checkbox" style="width:auto" ${i>4&&!s.tied[i].includes(f.id)?'disabled':''} ${s.m[f.id][i]?'checked':''} onchange="FS.m['${f.id}'][${i}]=this.checked?1:0;fgrid()">`).join('')}<td>${tot(f)}</tr>`).join('')}</table></div>${ld.length==1?`<button class="b" onclick="decl('${ld[0].id}')">🏆 Declarar ganador: ${esc(ld[0].al)}</button>`:`<p>⚠ Empate entre ${ld.map(f=>esc(f.al)).join(', ')}.</p><button class="b r" onclick="tieb()">Añadir pregunta de desempate</button>`}`)}
function tieb(){const s=FS,ld=s.fs.filter(f=>s.m[f.id].reduce((a,b)=>a+b,0)==Math.max(...s.fs.map(g=>s.m[g.id].reduce((a,b)=>a+b,0))));if(s.n>=s.qs.length)return alert('No quedan preguntas de desempate: importa más en Admin');s.tied[s.n]=ld.map(f=>f.id);s.fs.forEach(f=>s.m[f.id].push(0));s.n++;fgrid()}
function decl(id){const f=DB.dd.find(x=>x.id==id),d=FS.d;DB.win[d]={id,al:f.al};DB.log.push({id:'cine'+d,t:new Date().toISOString(),j:'Doomsday · ganador '+d+' nov',al:f.al,w:1,p:['cine'],e:0});save();go(`<div class="card c"><h1>🏆 ¡${esc(f.al)} GANA LA ENTRADA!</h1><p>Doomsday · ${d} de noviembre. Confirma la entrega en Admin.</p><button class="b" onclick="home()">Inicio</button></div>`);conf()}
/* ---------- Administración, exportación e importación ---------- */
const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};
const cs=v=>{v=String(v??'');if(/^[=+\-@\t\r]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'};
const csv=()=>dl('gn-centia.csv','\ufeff'+[['tipo','id','fecha','juego/alias','dia','puntaje','segundos','premio','entregado','carrera'],...DB.log.map(x=>['juego',x.id,x.t,x.j+(x.al?' · '+x.al:''),'',x.w,'',x.p.map(p=>PN[p]).join('+'),x.e,'']),...DB.dd.map(x=>['doomsday',x.id,x.t,x.al,x.dia,x.pts,x.seg,'','',x.ca])].map(r=>r.map(cs).join(',')).join('\r\n'),'text/csv');
const rd=(f,cb)=>{if(!f)return;const r=new FileReader();r.onload=()=>{try{cb(JSON.parse(r.result))}catch(e){alert('Archivo inválido')}};r.readAsText(f)};
const up=(k,f)=>{if(!f)return;const r=new FileReader();r.onload=()=>{DB[k]=r.result;save();alert('Imagen guardada')};r.readAsDataURL(f)};
const impq=f=>rd(f,o=>{let n=0;for(const k in o){if(!B[k]||!Array.isArray(o[k]))continue;DB.ex[k]=DB.ex[k]||[];o[k].forEach(q=>{if(!Array.isArray(q)||bank(k).some(b=>b[0]==q[0]))return;if('mplgx'.includes(k)&&new Set(q.slice(1,5)).size!=4)return;DB.ex[k].push(q);n++})}save();alert(n+' preguntas añadidas')});
const sv=()=>{Object.keys(PN).forEach(k=>DB.inv[k]=Math.max(0,Math.floor(+$('#i_'+k).value||0)));save();alert('Inventario guardado');panel()};
function panel(){const I=DB.inv,gs={};DB.log.forEach(x=>{const k=x.j.split(' ·')[0];(gs[k]=gs[k]||[0,0])[0]++;gs[k][1]+=x.w});
go(`<h2>⚙ Administración</h2>
<div class="card"><h3>Inventario</h3><p><small>Se descuenta solo al confirmar la entrega física.</small></p><div class="grid">${Object.keys(PN).map(k=>`<label>${PN[k]} ${I[k]<5?'⚠ poco stock':''}<input type="number" min="0" id="i_${k}" value="${I[k]}"></label>`).join('')}</div><button class="b" onclick="sv()">Guardar inventario</button></div>
<div class="card"><h3>Premios por entregar</h3>${DB.log.filter(x=>x.p.length&&!x.e).slice(-30).map(x=>`<p>${esc(x.j)}${x.al?' · '+esc(x.al):''}: ${x.p.map(p=>PN[p]).join(' + ')} <button class="b s" onclick="ent('${x.id}');panel()">Entregado</button></p>`).join('')||'<p>Ninguno</p>'}</div>
<div class="card"><h3>Estadísticas</h3><p><small>Se cuentan partidas, no personas únicas.</small></p>${Object.keys(gs).map(k=>`<p>${esc(k)}: ${gs[k][0]} partidas · ${Math.round(100*gs[k][1]/gs[k][0])} % con premio</p>`).join('')}${['23','24'].map(d=>{const r=rk(d);return `<p>Doomsday ${d} nov: ${r.length} clasificatorias · promedio ${r.length?(r.reduce((a,x)=>a+x.pts,0)/r.length).toFixed(2):'—'}/6${DB.win[d]?' · Ganador: '+esc(DB.win[d].al):''}</p>`}).join('')}<p>Entregas confirmadas: ${DB.log.filter(x=>x.e).length}</p></div>
<div class="card"><h3>Torneo y ajustes</h3><div class="grid"><select onchange="DB.day=this.value;save()"><option value="23" ${DB.day=='23'?'selected':''}>Jornada: lunes 23</option><option value="24" ${DB.day=='24'?'selected':''}>Jornada: martes 24</option></select><button class="b r" onclick="DB.lock[DB.day]^=1;save();panel()">${DB.lock[DB.day]?'🔓 Reabrir':'🔒 Cerrar'} jornada ${DB.day}</button><button class="b s" onclick="DB.cfg.rm^=1;save();rm()">Reducir animaciones</button><button class="b s" onclick="const p=prompt('Nuevo PIN');if(p){DB.pin=p;save()}">Cambiar PIN (hoy: 1234)</button></div><p><small>El PIN es solo una barrera de interfaz, no seguridad criptográfica. Los datos viven únicamente en este navegador: exporta respaldos.</small></p></div>
<div class="card"><h3>Datos</h3><div class="grid"><button class="b" onclick="csv()">Exportar CSV</button><button class="b" onclick="dl('gn-centia-respaldo.json',JSON.stringify(DB),'application/json')">Respaldo JSON</button><label class="b s">Restaurar respaldo<input type="file" hidden accept=".json" onchange="rd(this.files[0],o=>{if(!o.inv||!Array.isArray(o.log))throw 0;DB=Object.assign(DB,o);save();alert('Restaurado');panel()})"></label><label class="b s">Importar preguntas (JSON)<input type="file" hidden accept=".json" onchange="impq(this.files[0])"></label><label class="b s">Cargar logo GN Centia<input type="file" hidden accept="image/*" onchange="up('logo',this.files[0])"></label><label class="b s">Cargar imagen de Eureka<input type="file" hidden accept="image/*" onchange="up('eu',this.files[0])"></label></div></div>`)}
rm();$('#sb').textContent=DB.cfg.snd?'🔊':'🔇';home();
</script></body></html>
